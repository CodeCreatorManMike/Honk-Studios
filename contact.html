<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#113262">
<title>Contact Honk Studios | Recording Studio Oxford</title>
<meta name="description" content="Get in touch with Honk Studios recording studio in Oxford — email, WhatsApp, phone, or use the contact form to ask about recording, mixing or rehearsal space hire.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Honk Studios">
<meta property="og:title" content="Contact Honk Studios | Recording Studio Oxford">
<meta property="og:description" content="Get in touch with Honk Studios recording studio in Oxford — email, WhatsApp, phone, or use the contact form to ask about recording, mixing or rehearsal space hire.">
<meta property="og:url" content="https://honkstudiosoxford.co.uk/contact.html">
<meta property="og:image" content="https://honkstudiosoxford.co.uk/assets/icons/png/header-image.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Contact Honk Studios | Recording Studio Oxford">
<meta name="twitter:description" content="Get in touch with Honk Studios recording studio in Oxford — email, WhatsApp, phone, or use the contact form to ask about recording, mixing or rehearsal space hire.">
<meta name="twitter:image" content="https://honkstudiosoxford.co.uk/assets/icons/png/header-image.png">
<link rel="canonical" href="https://honkstudiosoxford.co.uk/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bree+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/png" href="assets/icons/png/honk-logo.png">
</head>
<body data-page="contact">
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <h1>Get in Touch</h1>
    <p>We're here to help with your project.</p>
  </div>
</section>

<section class="section-tight">
  <div class="container grid grid-2">
    <div class="info-card">
      <div class="info-row"><img src="assets/icons/png/email-envelope.png" alt="" loading="lazy" decoding="async"><div><strong>Email</strong><br>robin@honkstudios.co.uk</div></div>
      <div class="info-row"><img src="assets/icons/svg/chat.svg" alt="" loading="lazy" decoding="async"><div><strong>WhatsApp</strong><br>Chat with us for rates, availability and quick answers.</div></div>
      <a class="btn btn-primary" style="margin:6px 0 18px" href="#" data-wa-message="Hi Honk Studios! I have a question about booking / rates.">Chat on WhatsApp</a>
      <div class="info-row"><img src="assets/icons/svg/link.svg" alt="" loading="lazy" decoding="async"><div><strong>Phone</strong><br>+44 7592 399014</div></div>
    </div>
    <div class="info-card">
      <form class="contact-form" id="contact-form">
        <div class="form-row">
          <input name="name" placeholder="Your name" required>
          <input name="email" type="email" placeholder="Email address" required>
        </div>
        <input name="subject" placeholder="Subject">
        <textarea name="message" placeholder="Your message"></textarea>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="hours-card">
      <img src="assets/icons/png/clock.png" alt="" loading="lazy" decoding="async">
      <div>
        <h3 style="margin-bottom:4px">Studio Opening Hours</h3>
        <p class="muted" style="margin:0">Mon &ndash; Fri: 10am &ndash; 8pm<br>Sat &ndash; Sun: By arrangement</p>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
